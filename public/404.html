<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | HK Event Management</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--bg-body);text-align:center;padding:24px;">

  <div style="max-width:560px;background:#ffffff;padding:56px 40px;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--gold-border);">
    <a href="/" style="display:inline-block;margin-bottom:24px;">
      <img src="/logo.png" alt="HK Event Logo" style="width:72px;height:72px;border-radius:50%;margin:0 auto;box-shadow:var(--shadow-gold-sm);">
    </a>

    <div class="subheading-badge">404 Error</div>
    <h1 style="font-size:2.8rem;margin-bottom:12px;">Moment Not Found</h1>
    <p style="color:var(--text-secondary);font-size:1.05rem;line-height:1.6;margin-bottom:32px;">
      The page or event album you are looking for might have been archived, renamed, or temporarily unavailable.
    </p>

    <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
      <a href="/" class="btn btn-primary btn-sm">Return Home</a>
      <a href="/projects" class="btn btn-outline btn-sm">Browse Projects</a>
    </div>
  </div>

  <p style="margin-top:28px;font-size:0.85rem;color:var(--text-muted);">
    &copy; 2026 HK Event Management. Directed by Keshara Sahan. &bull; Developer By <a href="https://theekshanavidu.github.io/portfolio/" target="_blank" rel="noopener noreferrer" style="color:var(--gold-primary);font-weight:600;text-decoration:none;">Theekshana Viduranga</a>
  </p>

</body>
</html>
